# EEG Preprocessing Configuration
# Phase IV Multi-Site Biomarker Validation

# Global Settings
seed: 42
sampling_rate_hz: 256
line_noise_hz: 50                 # 60Hz for US sites (UCSD)
bandpass_hz: [1, 45]
beta_band_hz: [13, 30]            # Core5 beta-burst frequency range
epoch_len_s: 2.0
epoch_overlap: 0.5
car_reference: true               # Common Average Reference
intersection_montage: "standard_1020"

# Quality Control Thresholds
artifact_reject:
  peak_to_peak_uV: 1000          # Maximum allowable amplitude (very relaxed for ds004584)
  flat_uV: 0.01                  # Minimum signal variance (further relaxed for ds004584)
  impedance_threshold_kohm: 10   # Maximum electrode impedance
  min_valid_epochs_pct: 40       # Minimum % valid epochs per session (more permissive)
  max_flat_epochs_pct: 70        # Maximum % flat epochs allowed (more permissive)

# Beta-Burst Detection (Locked Parameters)
burst_detection:
  method: "median_plus_2mad"     # Threshold = Median + 2×MAD
  min_duration_ms: 100           # Minimum burst duration
  min_gap_ms: 50                 # Minimum inter-burst interval

# Core5 Feature Definitions (Locked from Phase III)
core5_features:
  - duration_cv                  # CV of burst durations
  - duty_cycle                   # Proportion time in burst state
  - mean_duration_ms             # Average burst duration
  - median_duration_ms           # Median burst duration
  - motor_posterior_duty_ratio   # Spatial distribution ratio

# Spatial Region Definitions
spatial_regions:
  motor: ["C3", "Cz", "C4"]
  posterior: ["P3", "Pz", "P4", "O1", "Oz", "O2"]
  intersection_channels: [
    "Fp1", "Fp2", "F7", "F3", "Fz", "F4", "F8",
    "T7", "C3", "Cz", "C4", "T8",
    "P7", "P3", "Pz", "P4", "P8",
    "O1", "Oz", "O2"
  ]

# Dataset-Specific Configurations
datasets:
  ds002778:
    name: "UCSD_Resting_State"
    type: "BIDS"
    root: "data/bids/ds002778"
    line_noise_hz: 60             # US power grid
    rest_task_codes: ["rest"]
    medication_state: "as_reported"
    eeg_extension: ".bdf"
    n_subjects_expected: 31        # 15 PD + 16 HC
    sessions: ["ses-off", "ses-on", "ses-hc"]  # PD off/on + HC sessions
    artifact_reject:
      peak_to_peak_uV: 5000       # Higher threshold for BDF data
      flat_uV: 0.000000000001     # Extremely relaxed for filtered BDF data (variance ~1e-11)
      max_flat_epochs_pct: 95     # Very permissive for this dataset

  ds004584:
    name: "Eyes_Open_PD_HC"
    type: "BIDS"
    root: "bids/ds004584"
    rest_task_codes: ["Rest"]      # Actual task name from BIDS
    n_subjects_expected: 149       # 100 PD + 49 HC
    channels: 63                   # Actual channel count from dataset
    line_noise_hz: 60             # US power grid (Iowa)

  ds003490:
    name: "Auditory_Oddball_Rest"
    type: "BIDS"
    root: "data/bids/ds003490"
    rest_task_codes: ["Rest"]
    task_codes: ["oddball"]
    n_subjects_expected: 50        # 25 PD + 25 HC

  ds003509:
    name: "Simon_Conflict_Rest"
    type: "BIDS"
    root: "data/bids/ds003509"
    rest_task_codes: ["rest"]
    task_codes: ["simon"]
    n_subjects_expected: 56        # 28 PD + 28 HC

  iowa_narayanan:
    name: "Iowa_Narayanan_Lab"
    type: "RAW"
    root: "data/raw/iowa"
    to_bids: true
    mapping_file: "config/channels_map.yaml"
    n_subjects_expected: "TBD"     # Per lab communication

# CORAL Domain Adaptation Settings
coral:
  regularization: 0.000001       # Numerical stability (1e-6 as decimal to avoid YAML string parsing)
  method: "eigendecomposition"   # Locked implementation
  normalize: true                # Z-score features before CORAL

# Locked Classification Model (Phase III Optimized)
model:
  type: "logistic_regression"
  locked_weights_path: "models/phase3/core5_coral_logreg.pkl"
  features: "core5"              # Fixed feature set
  domain_adaptation: "coral"     # Fixed adaptation method
  retraining_allowed: false      # Regulatory requirement

# LOSO Validation Settings
loso_validation:
  method: "leave_one_site_out"
  statistical_test: "one_sample_ttest"
  hypothesis:
    null: "mean_ba <= 0.50"      # Chance performance
    alternative: "mean_ba > 0.50"
    alpha: 0.05                  # One-sided test
  design_target_ba: 0.65         # Clinical meaningfulness threshold
  bootstrap_iterations: 1000

# Quality Control and Monitoring
qc_monitoring:
  weekly_reports: true
  site_drift_threshold_pp: 10    # Percentage points
  consecutive_weeks_alert: 2
  metrics_tracked:
    - balanced_accuracy
    - sensitivity
    - specificity
    - processing_latency_ms
    - valid_epochs_percentage
    - signal_quality_score

# Output Specifications
outputs:
  features_format: "csv"         # For regulatory review
  results_format: "json"         # Machine readable
  figures_format: "png"          # High resolution
  reports_format: "html"         # Interactive dashboards
  backup_format: "hdf5"          # Efficient storage

# Regulatory Compliance
compliance:
  version_control: true          # Git tracking required
  audit_logging: true           # Complete processing logs
  data_integrity_checks: true   # Checksum validation
  reproducibility_seed: 42      # Fixed randomization
  locked_pipeline_validation: true