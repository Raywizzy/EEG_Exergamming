# Leave-One-Site-Out (LOSO) Configuration
# Phase III multi-site validation settings

validation:
  method: leave_one_site_out
  sites: [LEI, BNDU, UCSD]
  n_permutations: 1000
  n_bootstrap: 1000
  random_seed: 42

models:
  primary:
    name: logistic
    type: LogisticRegression
    params:
      random_state: 42
      max_iter: 1000
      class_weight: balanced

  secondary:
    name: svm
    type: SVC
    params:
      random_state: 42
      probability: true
      class_weight: balanced

features:
  feature_set: Core5
  scaling: StandardScaler
  domain_adaptation: CORAL

acceptance_criteria:
  primary_endpoint:
    metric: balanced_accuracy
    threshold: 0.60
    confidence_level: 0.95
    min_lower_bound: 0.55

  secondary_endpoints:
    - metric: sensitivity
      threshold: 0.60
    - metric: specificity
      threshold: 0.60
    - metric: roc_auc
      threshold: 0.65

  statistical_significance:
    alpha: 0.05
    method: permutation_test

  consistency:
    max_site_variance: 0.10  # No site should be >10% below mean
    min_site_performance: 0.55  # Minimum BA per site

reporting:
  plots:
    - confusion_matrix
    - roc_curves
    - calibration_plots
    - feature_importance
    - site_comparison

  tables:
    - loso_summary
    - per_site_metrics
    - confidence_intervals
    - permutation_results